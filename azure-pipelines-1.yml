trigger:
- main

pool:
  name: 'VMSSNikeCopy'

steps:
- script: |
   sudo apt-get update --fix-missing

    sudo apt-get install -y docker.io --fix-missing

    which docker

    docker --version

    sudo docker ps
  displayName: 'Install Docker'
- script: |
    sudo docker ps
    sudo docker version
  displayName: Test Docker
- script: |
    echo "Process:"
    id
     
    echo ""
    echo "Account:"
    id AzDevOps
     
    echo ""
    echo "Docker Group:"
    getent group docker
     
    echo ""
    echo "Docker Access:"
    sudo docker ps
  displayName: Proof
- script: |
    sudo usermod -aG docker AzDevOps
     
    echo "After update:"
    getent group docker
     
    sudo docker ps
  displayName: Test Docker Group
- script: |
    sudo docker build -t todotask:$(Build.BuildId) .
  displayName: Test Docker Build
