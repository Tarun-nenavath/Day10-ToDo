trigger:
- main

pool:
  name: 'VMSSNikeCopy'

steps:
- script: |
    echo "PATH=$PATH"

    echo "which docker"
    which docker || true

    echo "docker binary"
    ls -l /usr/bin/docker || true

    echo "sudo which docker"
    sudo which docker || true

    echo "sudo docker version"
    sudo docker --version || true

    echo "id"
    id

    echo "groups"
    groups
  displayName: Verify Docker Installation