# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '36735474-e99b-4334-b5e5-22ea3c731501'
  imageRepository: 'todotask'
  containerRegistry: 'acrtodo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  name: 'VMSSNikeCopy'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      name: 'VMSSNikeCopy'
    steps:
    - script: |
        sudo apt-get update
        sudo apt-get install -y nodejs npm docker.io
      displayName: Install Tools

    - script: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      displayName: Install Azure CLI

    
    - script: |
        sudo usermod -aG docker AzDevOps
         
        echo "After adding:"
        id AzDevOps
      displayName: 'Add AzDevOps To Docker Group'

    - script: |
        echo "Docker group entry:"
        getent group docker
         
        echo ""
        echo "AzDevOps user:"
        id AzDevOps
      displayName: 'Check Docker Group Membership'
    

    - script: |
        echo "Process identity:"
        id
         
        echo "Docker group:"
        getent group docker
         
        echo "Docker binary:"
        which docker
         
        echo "Docker version:"
        docker --version || true
         
        echo "Docker daemon:"
        sudo docker ps
      displayName: Compare User Context  
    
    
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
    - task: AzureCLI@3
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'Azure subscription 1(9e8fab54-2295-4a0b-a7f2-915167edc02f)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az container create \
                    --name acrtodo \
                    --resource-group Day10-acr \
                    --image $(containerRegistry)/$(imageRepository):$(tag) \
                    --registry-login-server $(containerRegistry) \
                    --registry-username acrtodo  \
                    --registry-password 6FHimAUQANQCN19EWCkD0CWn3W6im4GU41bsmXKq7pvPtWWHrcGwJQQJ99CJACMsfrFEqg7NAAACAZCR8haY \
                    --dns-name-label acrtodo.azurecr.io
