trigger:
- main

resources:
- repo: self

variables:
  dockerRegistryServiceConnection: '36735474-e99b-4334-b5e5-22ea3c731501'
  imageRepository: 'todotask'
  containerRegistry: 'acrtodo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Build and push stage'

  jobs:
  - job: Build
    displayName: 'Build'

    pool:
      name: 'VMSSNikeCopy'

    steps:
    - checkout: self

    - script: |
        echo "Current user:"
        whoami

        echo "Current groups:"
        groups

        echo "Installed tools:"
        az --version
        docker --version
        node --version
        npm --version

        echo "Docker access test:"
        docker ps
      displayName: 'Verify VMSS Agent Tools'

    - task: Docker@2
      displayName: 'Build and push image to ACR'
      inputs:
        command: 'buildAndPush'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        containerRegistry: '$(dockerRegistryServiceConnection)'
        tags: |
          $(tag)

    - task: AzureCLI@3
      displayName: 'Deploy Azure Container Instance'
      inputs:
        connectionType: 'azureRM'
        azureSubscription: 'Azure subscription 1(9e8fab54-2295-4a0b-a7f2-915167edc02f)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az container create \
            --name acrtodo \
            --resource-group Day10-acr \
            --image "$(containerRegistry)/$(imageRepository):$(tag)" \
            --registry-login-server "$(containerRegistry)" \
            --registry-username "$(ACR_USERNAME)" \
            --registry-password "$(ACR_PASSWORD)" \
            --dns-name-label acrtodo